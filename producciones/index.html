    <style>
      :root {
        --carbon: #131010;
        --brasa: #1c1817;
        --linea: #372e2a;
        --crema: #f4d2a1;
        --texto: #c9baab;
        --humo: #9a8b7e;
        --fuego: #f26a21;
        --fuego-bajo: #7a220c;
        --display: "Archivo Black", "Arial Black", system-ui, sans-serif;
        --cuerpo: "Barlow", "Segoe UI", system-ui, sans-serif;
        --dato: "IBM Plex Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100svh;
        background: var(--carbon);
        color: var(--texto);
        font-family: var(--cuerpo);
        font-size: 17px;
        line-height: 1.55;
      }
      a { color: inherit; }
      img { display: block; max-width: 100%; }
      .tope {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.15rem 1.5rem;
        border-bottom: 1px solid var(--linea);
        font-family: var(--dato);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--humo);
      }
      .tope a { text-decoration: none; }
      .tope a:hover { color: var(--crema); }
      .caja {
        width: min(74rem, calc(100% - 2rem));
        margin-inline: auto;
      }
      .hero { padding: 3.2rem 0 2.5rem; }
      .rotulo {
        margin: 0 0 0.7rem;
        font-family: var(--dato);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--fuego);
      }
      h1 {
        margin: 0 0 1rem;
        max-width: 14ch;
        font-family: var(--display);
        font-size: clamp(2.5rem, 8vw, 4.8rem);
        line-height: 0.94;
        letter-spacing: -0.03em;
        color: var(--crema);
        text-transform: uppercase;
      }
      .lead { margin: 0 0 2.6rem; max-width: 46ch; color: var(--humo); }
      .cta-wrap {
        position: relative;
        display: inline-grid;
        place-items: center;
        width: min(100%, 22rem);
        height: 8.2rem;
      }
      #chispas {
        position: absolute;
        inset: -36px -48px 8px;
        width: calc(100% + 96px);
        height: calc(100% + 28px);
        pointer-events: none;
      }
      .boton-3d {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3.4rem;
        padding: 0.85rem 1.4rem;
        border: 0;
        border-radius: 0.55rem;
        color: #2a1106;
        background: linear-gradient(#ffb056, var(--fuego) 55%, #d24a12);
        font-family: var(--display);
        font-size: 1.05rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-decoration: none;
        translate: 0 0;
        rotate: 0deg;
        scale: 1;
        box-shadow:
          inset 0 2px 0 rgb(255 230 180 / 0.7),
          inset 0 -3px 0 rgb(90 18 4 / 0.45),
          0 3px 0 #5a1608,
          0 8px 0 var(--fuego-bajo),
          0 16px 28px rgb(0 0 0 / 0.45);
        transition: translate 160ms cubic-bezier(0.16, 1, 0.3, 1), scale 160ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .boton-3d:hover { translate: 0 -4px; scale: 1.03; }
      .boton-3d:active {
        translate: 0 6px;
        scale: 0.98;
        box-shadow:
          inset 0 3px 8px rgb(80 20 4 / 0.55),
          0 1px 0 #5a1608,
          0 4px 10px rgb(0 0 0 / 0.4);
      }
      .series { display: grid; gap: 3.2rem; padding-bottom: 3rem; }
      .serie h2 {
        margin: 0 0 0.45rem;
        font-family: var(--display);
        font-size: clamp(1.5rem, 3vw, 2rem);
        color: var(--crema);
        text-transform: uppercase;
      }
      .serie p { margin: 0 0 1rem; max-width: 52ch; color: var(--humo); }
      .fotos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
        gap: 0.7rem;
      }
      .fotos figure { margin: 0; background: var(--brasa); overflow: hidden; }
      .fotos img {
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
      }
      .rama {
        display: grid;
        grid-template-columns: minmax(11rem, 16rem) minmax(0, 1fr);
        gap: 1.6rem;
        align-items: center;
        margin: 0 0 2.5rem;
        padding: 0.85rem;
        border: 1px solid var(--linea);
        background: var(--brasa);
        text-decoration: none;
      }
      .rama img {
        width: 100%;
        aspect-ratio: 9 / 16;
        object-fit: cover;
      }
      .rama h2 {
        margin: 0 0 0.5rem;
        font-family: var(--display);
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        color: var(--crema);
        text-transform: uppercase;
      }
      .aviso, .pie {
        padding-bottom: 2.5rem;
        font-size: 0.88rem;
        color: var(--humo);
        max-width: 60ch;
      }
      @media (max-width: 40rem) {
        .rama { grid-template-columns: 1fr; }
        .rama img { max-width: 16rem; }
        .fotos {
          display: flex;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
          -webkit-overflow-scrolling: touch;
        }
        .fotos figure {
          flex: 0 0 74%;
          scroll-snap-align: start;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boton-3d, .boton-3d:hover, .boton-3d:active {
          translate: 0 0;
          scale: 1;
          transition: none;
        }
        #chispas { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="tope">
      <span>Producciones</span>
      <a href="../">Cero Coma</a>
    </div>
    <main class="caja">
      <header class="hero">
        <p class="rotulo" data-campo="rotulo"></p>
        <h1 data-campo="titulo"></h1>
        <p class="lead" data-campo="lead"></p>
        <div class="cta-wrap">
          <canvas id="chispas" aria-hidden="true"></canvas>
          <a class="boton-3d" data-cta href="https://wa.me/34643403723" target="_blank" rel="noreferrer"></a>
        </div>
      </header>
      <div class="series" data-series></div>
      <p class="rotulo">Rama de muestra</p>
      <a class="rama" data-rama href="mechada-hot/">
        <img alt="" width="1080" height="1920">
        <div>
          <h2></h2>
          <p></p>
        </div>
      </a>
      <p class="aviso" data-campo="aviso"></p>
    </main>
    <script id="contenido-local" type="application/json">
{
  "marca": "Producciones",
  "rotulo": "Servicio a medida",
  "titulo": "Tu producto, puesto en escena.",
  "lead": "No rodamos un anuncio genérico. Cogemos lo que vendes —una hamburguesa, una tarta, el plato del día— y lo dejamos listo para redes: vídeo corto e imágenes de producto. Tú mandas el plato o fotos del móvil. Nosotros montamos la escena.",
  "whatsapp": "34643403723",
  "cta": "Encargar una pieza",
  "cta_mensaje": "Hola, quiero un encargo de Producciones a medida.",
  "series": [
    {
      "id": "hamburguesas",
      "titulo": "Hamburguesas",
      "texto": "Smash, smash doble, smash en sartén, puesto de festival. El producto manda: carne, queso, fuego. Cada local tiene la suya; no reutilizamos la de otro.",
      "fotos": [
        { "src": "fotos/hamburguesas/01-sarten.jpg", "alt": "Hamburguesa smash en sartén de hierro, queso fundido y brasas." },
        { "src": "fotos/hamburguesas/02-hero.jpg", "alt": "Primer plano de hamburguesa mechada con queso." },
        { "src": "fotos/hamburguesas/03-fuego.jpg", "alt": "Hamburguesa sobre la parrilla con llama." },
        { "src": "fotos/hamburguesas/04-detalle.jpg", "alt": "Detalle del queso fundido sobre la carne mechada." }
      ]
    },
    {
      "id": "tartas",
      "titulo": "Tartas",
      "texto": "Cheesecake, porción, tarta entera. Misma lógica que la hamburguesa: tu receta, tu emplatado, tu luz. Aquí hay línea de obrador (kraft, lino) y línea de noche (cacao, cobre).",
      "fotos": [
        { "src": "fotos/tartas/03-clasica.jpg", "alt": "Cheesecake clásica tostada en molde de kraft." },
        { "src": "fotos/tartas/04-nutella.jpg", "alt": "Cheesecake de avellana y chocolate en bandeja de kraft." },
        { "src": "fotos/tartas/05-limon.jpg", "alt": "Cheesecake de limón." },
        { "src": "fotos/tartas/06-pistacho.jpg", "alt": "Cheesecake de pistacho." },

        { "src": "fotos/tartas/01-chocolate.jpg", "alt": "Porción de tarta de chocolate y caramelo en plato negro." },
        { "src": "fotos/tartas/02-frutos.jpg", "alt": "Tarta de frutos rojos en bandeja de cobre, obrador de noche." }
      ]
    },
    {

      "titulo": "Puesta en escena",

  "rama": {

  },

    </script>
    <script>
      (function () {
        const local = document.getElementById("contenido-local");
        function esc(s) {
          return String(s || "").replace(/[&<>"']/g, function (c) {
            return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
          });
        }
        function pintar(data) {
          document.querySelector('[data-campo="rotulo"]').textContent = data.rotulo;
          document.querySelector('[data-campo="titulo"]').textContent = data.titulo;
          document.querySelector('[data-campo="lead"]').textContent = data.lead;
          document.querySelector('[data-campo="aviso"]').textContent = data.aviso;
          const cta = document.querySelector("[data-cta]");
          const msg = encodeURIComponent(data.cta_mensaje || "");
          cta.textContent = data.cta;
          cta.href = "https://wa.me/" + String(data.whatsapp || "").replace(/[^\d]/g, "") + (msg ? "?text=" + msg : "");
          const series = document.querySelector("[data-series]");
          series.innerHTML = data.series.map(function (s) {
            const fotos = (s.fotos || []).map(function (f) {
              return "<figure><img src=\"" + esc(f.src) + "\" alt=\"" + esc(f.alt) + "\" loading=\"lazy\" width=\"900\" height=\"1200\"></figure>";
            }).join("");
            return "<section class=\"serie\" id=\"" + esc(s.id) + "\"><h2>" + esc(s.titulo) + "</h2><p>" + esc(s.texto) + "</p><div class=\"fotos\">" + fotos + "</div></section>";
          }).join("");
          const rama = document.querySelector("[data-rama]");
          rama.href = data.rama.href;
          rama.querySelector("img").src = data.rama.portada;
          rama.querySelector("img").alt = data.rama.alt || "";
          rama.querySelector("h2").textContent = data.rama.nombre;
          rama.querySelector("p").textContent = data.rama.texto;
        }
        fetch("contenido.json", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(pintar)
          .catch(function () {
            try { pintar(JSON.parse(local.textContent)); }
            catch (e) {}
          });
      })();
    </script>
    <script>
      (function () {
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const canvas = document.getElementById("chispas");
        if (!canvas || reduce || !canvas.getContext) return;
        const ctx = canvas.getContext("2d");
        const wrap = canvas.parentElement;
        let w = 0, h = 0, smoke = [], sparks = [];
        function resize() {
          const r = wrap.getBoundingClientRect();
          w = canvas.width = Math.floor(r.width * devicePixelRatio);
          h = canvas.height = Math.floor(r.height * devicePixelRatio);
          canvas.style.width = r.width + "px";
          canvas.style.height = r.height + "px";
        }
        function spawn() {
          const cx = w * 0.5, cy = h * 0.7;
          smoke.push({
            x: cx + (Math.random() - 0.5) * w * 0.18,
            y: cy,
            r: 3 + Math.random() * 7,
            vx: (Math.random() - 0.5) * 0.2,
            vy: -0.45 - Math.random() * 0.4,
            a: 0.1 + Math.random() * 0.08,
            life: 1
          });
          sparks.push({
            x: cx + (Math.random() - 0.5) * w * 0.3,
            y: cy - 4,
            vx: (Math.random() - 0.5) * 1.8,
            vy: -2.1 - Math.random() * 2.8,
            life: 1,
            g: 0.04 + Math.random() * 0.025
          });
        }
        let last = 0;
        function tick(t) {
          if (document.hidden) { requestAnimationFrame(tick); return; }
          if (t - last > 40) { spawn(); spawn(); last = t; }
          ctx.clearRect(0, 0, w, h);
          smoke = smoke.filter(function (p) {
            p.x += p.vx * devicePixelRatio;
            p.y += p.vy * devicePixelRatio;
            p.r += 0.12 * devicePixelRatio;
            p.life -= 0.008;
            p.a *= 0.992;
            if (p.life <= 0) return false;
            ctx.beginPath();
            ctx.fillStyle = "rgba(180,170,160," + (p.a * p.life) + ")";
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            return true;
          });
          sparks = sparks.filter(function (p) {
            p.vy += p.g;
            p.x += p.vx * devicePixelRatio;
            p.y += p.vy * devicePixelRatio;
            p.life -= 0.018;
            if (p.life <= 0) return false;
            ctx.fillStyle = p.life > 0.45 ? "rgba(255,210,80," + p.life + ")" : "rgba(242,106,33," + p.life + ")";
            const s = (1.6 + p.life * 1.8) * devicePixelRatio;
            ctx.fillRect(p.x, p.y, s, s * 2.2);
            return true;
          });
          requestAnimationFrame(tick);
        }
        resize();
        window.addEventListener("resize", resize);
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
